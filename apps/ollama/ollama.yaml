apiVersion: v1
kind: Namespace
metadata:
  name: ai-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-services
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
        # ========== 新增：容器内挂载路径 ==========
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      # ========== 新增：绑定宿主机目录HostPath ==========
      volumes:
      - name: ollama-data
        hostPath:
          path: /data/ollama-model-storage
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ai-services
spec:
  type: NodePort
  selector: { app: ollama }
  ports:
  - port: 11434
    targetPort: 11434
